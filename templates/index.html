<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finnish Story Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>Finnish Story Generator</h1>
            <p>Create beautiful A1/A2 language learning stories with AI.</p>
        </header>

        <main>
            <div class="controls">
                <div class="level-selector">
                    <label for="levelSelect">Difficulty Level:</label>
                    <select id="levelSelect">
                        <option value="A1" selected>A1 – Breakthrough</option>
                        <option value="A2">A2 – Elementary</option>
                        <option value="B1">B1 – Intermediate</option>
                        <option value="B2">B2 – Upper Intermediate</option>
                        <option value="C1">C1 – Advanced</option>
                        <option value="C2">C2 – Mastery</option>
                    </select>
                </div>
                <div class="theme-selector">
                    <label for="themeSelect">Theme:</label>
                    <select id="themeSelect">
                        <option value="random">🎲 Random (Any Theme)</option>
                        <option value="winter">❄️ Winter</option>
                        <option value="spring">🌸 Spring</option>
                        <option value="summer">☀️ Summer</option>
                        <option value="autumn">🍂 Autumn</option>
                        <option value="everyday">🏠 Everyday Life</option>
                        <option value="special">✨ Special Occasions</option>
                    </select>
                </div>
                <div class="topic-group">
                <div class="custom-topic-selector topic-block">
                    <div class="topic-header">
                        <label for="customTopic">Or Custom Topic (optional):</label>
                        <div class="topic-actions">
                            <button type="button" class="ghost-btn" id="suggestToggle" onclick="toggleSuggestions()">
                                💡 Suggest topics
                            </button>
                            <button type="button" class="ghost-btn" onclick="applyRandomSuggestion()">🎲 Surprise me</button>
                        </div>
                    </div>
                    <textarea id="customTopic" rows="3"
                        placeholder="e.g. A snowman in a yard melts a little every day until it is gone"></textarea>
                    <div id="suggestionPanel" class="suggestion-panel hidden">
                        <div class="suggestion-panel-header">
                            <p class="suggestion-hint" id="suggestionHint">Thinking up ideas…</p>
                            <button type="button" class="ghost-btn" id="suggestionRefresh"
                                onclick="refreshSuggestions()">🔄 New ideas</button>
                        </div>
                        <div id="suggestionList" class="suggestion-list"></div>
                    </div>
                </div>
                <div class="custom-topic-selector topic-block">
                    <label for="customSetting">Setting / Place (Optional):</label>
                    <input type="text" id="customSetting" placeholder="e.g. A quiet library, Turku, Grandma's house...">
                </div>
                </div>
                <div class="page-count-selector">
                    <label for="pageCount">Number of Pages:</label>
                    <input type="number" id="pageCount" value="10" min="3" max="20" style="width: 60px;">
                </div>
                <div class="aspect-ratio-selector">
                    <label for="aspectRatio">Image Dimensions:</label>
                    <select id="aspectRatio">
                        <option value="9:16" selected>📱 Vertical Full Screen (9:16)</option>
                        <option value="1:1">⬜ Square (1:1)</option>
                        <option value="3:4">📋 Portrait (3:4)</option>
                        <option value="4:3">🖼️ Landscape (4:3)</option>
                        <option value="16:9">🖥️ Widescreen (16:9)</option>
                    </select>
                </div>
                <div class="prompts-only-toggle">
                    <label for="promptsOnly" class="toggle-label">
                        <input type="checkbox" id="promptsOnly">
                        <span>📝 Prompts only (no image generation)</span>
                    </label>
                </div>
                <button id="generateBtn" onclick="startGeneration()">
                    <span class="icon">✨</span> Generate New Story
                </button>
                <div id="status" class="status-badge hidden">Ready</div>
            </div>

            <div id="progressContainer" class="hidden">
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <p id="logMessage">Initializing...</p>
            </div>

            <div id="storyContainer" class="story-grid hidden">
                <!-- Story cards will be injected here -->
            </div>

            <div id="downloadSection" class="hidden">
                <a href="/output/story.pdf" target="_blank" class="download-btn" id="pdfDownload">
                    Download PDF Book 📥
                </a>
                <a href="/output/image_prompts.txt" target="_blank" class="download-btn prompts-download hidden" id="promptsDownload">
                    Download Image Prompts 📝
                </a>
                <button onclick="archiveStory()" class="secondary-btn">
                    Save to Archive 💾
                </button>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>

</html>
